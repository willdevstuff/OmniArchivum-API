name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OmniArchivum.slnx

      - name: Build
        run: dotnet build OmniArchivum.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OmniArchivum.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  build-and-push-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./OmniArchivum.Api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniarchivum-api:latest
            ghcr.io/${{ github.repository_owner }}/omniarchivum-api:${{ github.sha }}
