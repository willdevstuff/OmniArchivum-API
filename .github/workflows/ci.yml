name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OmniArchivum.slnx

      - name: Build
        run: dotnet build OmniArchivum.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OmniArchivum.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step: the suite uses Node's built-in test runner, and the
      # frontend itself has no dependencies.
      - name: Test
        run: npm test

  build-and-push-image:
    needs: [build-and-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./OmniArchivum.Api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniarchivum-api:latest
            ghcr.io/${{ github.repository_owner }}/omniarchivum-api:${{ github.sha }}

  deploy-api:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App to the newly built image
        run: |
          az containerapp update \
            --name omniarchivum-api \
            --resource-group omniarchivum-rg \
            --image ghcr.io/${{ github.repository_owner }}/omniarchivum-api:${{ github.sha }}

  deploy-frontend:
    needs: [build-and-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: ""
          skip_app_build: true
